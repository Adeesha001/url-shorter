<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - URL Shorter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
      text-decoration: none;
    }

    .back {
      color: #374151;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 55px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .icon {
      width: 55px;
      height: 55px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      margin: 0 auto 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .signin {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #6b7280;
    }

    .signin a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .terms {
      margin-top: 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">URL Shorter</a>
  <a href="index.html" class="back">← Back to Home</a>
</header>

<div class="container">

  <div class="card">

    <div class="icon">👤</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Create your URL Shorter account
    </p>

    <form id="signupForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit" id="signupBtn">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <p class="terms">
      By creating an account, you agree to use URL Shorter
      responsibly.
    </p>

    <div class="signin">
      Already have an account?
      <a href="signin.html">Sign In</a>
    </div>

  </div>

</div>

<footer>
  URL Shorter • Simple. Fast. Shareable.
</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://efxpwizkfuxsjaeehapp.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_p2wQ_Cvk37BFIZKa4P6d9Q_WZg2rZ8i";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const form =
    document.getElementById("signupForm");

  const signupBtn =
    document.getElementById("signupBtn");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    signupBtn.disabled = true;

    signupBtn.textContent =
      "Creating account...";

    message.style.display = "none";


    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      signupBtn.disabled = false;

      signupBtn.textContent =
        "Create Account";

      return;
    }


    showMessage(
      "Account created! Please check your email and verify your account.",
      "success"
    );


    form.reset();

    signupBtn.disabled = false;

    signupBtn.textContent =
      "Create Account";

  });

</script>

</body>
</html>
