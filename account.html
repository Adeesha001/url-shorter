<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account - URL Shorter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav-container {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #2563eb;
    }

    .back {
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      color: #2563eb;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
    }

    .avatar {
      width: 75px;
      height: 75px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eff6ff;
      color: #2563eb;

      border-radius: 50%;

      font-size: 32px;
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .info-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .email {
      color: #111827;
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;

      padding: 14px;

      background: #111827;
      color: #ffffff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #000000;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 9px;

      text-align: center;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 600px) {

      .nav-container {
        padding: 15px;
      }

      .container {
        margin: 35px auto;
        padding: 15px;
      }

      .card {
        padding: 28px 20px;
      }

    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="nav-container">

      <a href="index.html" class="logo">
        URL Shorter
      </a>

      <a href="index.html" class="back">
        ← Back to Home
      </a>

    </div>

  </header>


  <!-- ACCOUNT -->

  <main class="container">

    <div class="card">

      <div class="avatar">
        👤
      </div>

      <h1>
        My Account
      </h1>

      <p class="subtitle">
        Your URL Shorter account
      </p>


      <div
        id="errorMessage"
        class="message"
      ></div>


      <div class="info-box">

        <div class="info-label">
          Email
        </div>

        <div
          class="email"
          id="userEmail"
        >
          Loading...
        </div>

      </div>


      <button id="signOutBtn">
        Sign Out
      </button>

    </div>

  </main>


  <footer>
    URL Shorter • Simple. Fast. Shareable.
  </footer>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://efxpwizkfuxsjaeehapp.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_p2wQ_Cvk37BFIZKa4P6d9Q_WZg2rZ8i";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const userEmail =
      document.getElementById(
        "userEmail"
      );

    const signOutBtn =
      document.getElementById(
        "signOutBtn"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =========================================
       LOAD USER
    ========================================= */

    async function loadAccount() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (
        !session ||
        !session.user
      ) {

        window.location.href =
          "signin.html";

        return;

      }


      userEmail.textContent =
        session.user.email;

    }


    /* =========================================
       SIGN OUT
    ========================================= */

    signOutBtn.addEventListener(
      "click",
      async function() {

        signOutBtn.disabled =
          true;

        signOutBtn.textContent =
          "Signing out...";


        const { error } =
          await supabaseClient.auth.signOut();


        if (error) {

          errorMessage.textContent =
            error.message;

          errorMessage.className =
            "message error";

          signOutBtn.disabled =
            false;

          signOutBtn.textContent =
            "Sign Out";

          return;

        }


        window.location.href =
          "index.html";

      }
    );


    /* =========================================
       START
    ========================================= */

    loadAccount();

  </script>

</body>
</html>
